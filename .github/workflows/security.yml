name: Security Pipeline (SAST, SCA, Secrets, DAST)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  security-scans:
    name: Security Scanners (Warning Mode)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository with full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 1. SAST (Semgrep)
        continue-on-error: true
        run: |
          echo "=== RUNNING SEMGREP SAST SCAN ==="
          pipx run semgrep scan --config p/python .

      - name: 2. SCA (pip-audit)
        continue-on-error: true
        run: |
          echo "=== RUNNING PIP-AUDIT SCA SCAN ==="
          pipx run pip-audit -r requirements.txt

      - name: 3. Secrets Scanning (Gitleaks)
        continue-on-error: true
        run: |
          echo "=== RUNNING GITLEAKS SECRETS SCAN ==="
          docker run --rm -v ${{ github.workspace }}:/repo zricethezav/gitleaks:latest git --verbose /repo

      - name: 4. Start Juice Shop target for DAST
        run: |
          echo "=== STARTING JUICE SHOP CONTAINER ==="
          docker run -d --name juiceshop -p 3000:3000 bkimminich/juice-shop
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
              echo "Juice Shop is UP and ready"
              break
            fi
            sleep 2
          done

      - name: 5. DAST (OWASP ZAP Baseline)
        continue-on-error: true
        run: |
          echo "=== RUNNING OWASP ZAP BASELINE SCAN ==="
          docker run --rm --network host -v ${{ github.workspace }}:/zap/wrk:rw ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:3000 -r zap.html -I

      - name: Upload ZAP Baseline HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap.html
